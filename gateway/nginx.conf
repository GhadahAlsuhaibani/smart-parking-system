# Smart Parking - Nginx API Gateway

# One line per request for monitoring: request line, status and time in seconds.
# gateway-exporter turns these lines into Prometheus metrics (see monitoring/nginxlog-exporter.yml).
log_format metrics '"$request" $status $request_time';

upstream user_service {
    server user-service:3001;
}

upstream parking_service {
    server parking-service:3002;
}

upstream reservation_service {
    server reservation-service:3003;
}

upstream payment_service {
    server payment-service:3004;
}

server {
    listen 80;

    access_log /dev/stdout;
    access_log syslog:server=gateway-exporter:5531,tag=nginx metrics;

    # Fail fast when a service is down instead of making the user wait.
    # 2.5 s is longer than two 1-second calls between services, so a slow
    # downstream service is not blamed on its caller.
    proxy_connect_timeout 1s;
    proxy_read_timeout 2500ms;

    # Answer in JSON, like the services, when nginx cannot reach a service.
    error_page 502 504 = @unavailable;
    location @unavailable {
        default_type application/json;
        return 503 '{"error":"Backend service unavailable"}';
    }

    # Internal operations that services call on each other; never exposed to clients.
    location ~* ^/spaces/[^/]+/(reserve|release)/?$ {
        default_type application/json;
        return 403 '{"error":"Internal route not available through the gateway"}';
    }

    location ~* ^/reservations/[^/]+/paid/?$ {
        default_type application/json;
        return 403 '{"error":"Internal route not available through the gateway"}';
    }

    # User Service
    location /users {
        proxy_pass http://user_service;
    }

    # Parking Service
    location /spaces {
        proxy_pass http://parking_service;
    }

    # Reservation Service
    location /reservations {
        proxy_pass http://reservation_service;
    }

    # Payment Service
    location /payments {
        proxy_pass http://payment_service;
    }

    # Gateway health check (not counted in the SLO)
    location = /health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok","service":"gateway"}';
    }

    # Anything else is not part of the API
    location / {
        default_type application/json;
        return 404 '{"error":"Unknown API route"}';
    }
}
