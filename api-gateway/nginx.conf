
# Smart Parking - Nginx API Gateway

upstream user_service {
    server user-service:3001;
}

upstream parking_service {
    server parking-service:3002;
}

upstream reservation_service {
    server reservation-service:3003;
}

upstream payment_service {
    server payment-service:3004;
}

server {
    listen 80;

    # User Service
    location /users {
        proxy_pass http://user_service;
    }

    # Parking Service
    location /spaces {
        proxy_pass http://parking_service;
    }

    # Reservation Service
    location /reservations {
        proxy_pass http://reservation_service;
    }

    # Payment Service
    location /payments {
        proxy_pass http://payment_service;
    }

    # Gateway health check
    location = /health {
        default_type application/json;
        return 200 '{"status":"ok","service":"gateway"}';
    }
}
